name: Send Pipeline Reports

on:
    workflow_call:
        inputs:
            artifact_name:
                description: Name of the uploaded report artifact
                required: true
                type: string

            email_subject:
                description: Email subject
                required: true
                type: string

            email_body:
                description: Summary message for the dashboard
                required: true
                type: string

            workflow_url:
                description: URL of the pipeline run
                required: false
                type: string
                default: ""

            scan_status:
                description: Overall scan job result
                required: false
                type: string
                default: "unknown"

            gitleaks_status:
                description: Gitleaks step result
                required: false
                type: string
                default: "unknown"

            trivy_status:
                description: Trivy step result
                required: false
                type: string
                default: "unknown"

            semgrep_status:
                description: Semgrep step result
                required: false
                type: string
                default: "unknown"

            sonarqube_status:
                description: SonarQube step result
                required: false
                type: string
                default: "unknown"

            sonarqube_gate:
                description: SonarQube quality gate result
                required: false
                type: string
                default: "N/A"

            sonarqube_bugs:
                description: SonarQube bugs count
                required: false
                type: string
                default: "0"

            sonarqube_vulnerabilities:
                description: SonarQube vulnerabilities count
                required: false
                type: string
                default: "0"

            sonarqube_code_smells:
                description: SonarQube code smells count
                required: false
                type: string
                default: "0"

            sonarqube_hotspots:
                description: SonarQube security hotspots count
                required: false
                type: string
                default: "0"

            sonarqube_dashboard_url:
                description: SonarQube dashboard URL
                required: false
                type: string
                default: ""

            gitleaks_count:
                description: Number of Gitleaks findings
                required: false
                type: string
                default: "N/A"

            trivy_count:
                description: Number of Trivy findings
                required: false
                type: string
                default: "N/A"

            semgrep_count:
                description: Number of Semgrep SAST findings
                required: false
                type: string
                default: "N/A"

            trivy_packages_count:
                description: Number of packages scanned by Trivy
                required: false
                type: string
                default: "N/A"

            total_count:
                description: Total security findings
                required: false
                type: string
                default: "N/A"

        secrets:
            MAIL_USERNAME:
                required: true
            MAIL_PASSWORD:
                required: true
            MAIL_TO:
                required: true

permissions:
    contents: read

jobs:
    email:
        name: Send Email
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - name: Download Report Artifact
              uses: actions/download-artifact@v7
              with:
                  name: ${{ inputs.artifact_name }}
                  path: reports

            - name: Prepare HTML Dashboard
              env:
                  EMAIL_SUBJECT: ${{ inputs.email_subject }}
                  EMAIL_SUMMARY: ${{ inputs.email_body }}
                  WORKFLOW_URL: ${{ inputs.workflow_url }}
                  SCAN_STATUS: ${{ inputs.scan_status }}
                  GITLEAKS_STATUS: ${{ inputs.gitleaks_status }}
                  TRIVY_STATUS: ${{ inputs.trivy_status }}
                  SEMGREP_STATUS: ${{ inputs.semgrep_status }}
                  SONARQUBE_STATUS: ${{ inputs.sonarqube_status }}
                  GITLEAKS_COUNT: ${{ inputs.gitleaks_count }}
                  TRIVY_COUNT: ${{ inputs.trivy_count }}
                  SEMGREP_COUNT: ${{ inputs.semgrep_count }}
                  SONARQUBE_GATE: ${{ inputs.sonarqube_gate }}
                  SONARQUBE_BUGS: ${{ inputs.sonarqube_bugs }}
                  SONARQUBE_VULNERABILITIES: ${{ inputs.sonarqube_vulnerabilities }}
                  SONARQUBE_CODE_SMELLS: ${{ inputs.sonarqube_code_smells }}
                  SONARQUBE_HOTSPOTS: ${{ inputs.sonarqube_hotspots }}
                  SONARQUBE_DASHBOARD_URL: ${{ inputs.sonarqube_dashboard_url }}
                  TRIVY_PACKAGES_COUNT: ${{ inputs.trivy_packages_count }}
                  TOTAL_COUNT: ${{ inputs.total_count }}
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p reports

                  python3 - <<'PY'
                  import html
                  import os
                  from pathlib import Path

                  def get(name, default="N/A"):
                      return os.environ.get(name, default).strip() or default

                  def esc(value):
                      return html.escape(value, quote=True)

                  def status_style(value):
                      value = value.lower()
                      if value == "success":
                          return "#dcfce7", "#166534", "SUCCESS"
                      if value in ("failure", "cancelled", "timed_out"):
                          return "#fee2e2", "#991b1b", "REVIEW REQUIRED"
                      if value in ("skipped", "disabled"):
                          return "#f1f5f9", "#475569", "SKIPPED"
                      return "#fef3c7", "#92400e", "UNKNOWN"

                  def status_card(label, raw):
                      bg, fg, display = status_style(raw)
                      return f"""
                        <td style="padding:6px;width:33.33%;vertical-align:top">
                          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                 style="border:1px solid #e5e7eb;border-radius:8px">
                            <tr><td style="padding:12px 10px">
                              <div style="font-size:11px;color:#6b7280;font-weight:600">{esc(label)}</div>
                              <div style="margin-top:6px">
                                <span style="display:inline-block;background:{bg};color:{fg};
                                  padding:4px 8px;border-radius:5px;font-size:11px;font-weight:bold">
                                  {esc(display)}
                                </span>
                              </div>
                            </td></tr>
                          </table>
                        </td>
                      """

                  subject = get("EMAIL_SUBJECT", "Security Scan Report")
                  summary = esc(get("EMAIL_SUMMARY", "Security scan completed."))
                  workflow_url = get("WORKFLOW_URL", "")
                  workflow_link = ""
                  if workflow_url.startswith(("https://github.com/", "https://")):
                      workflow_link = (
                          '<a href="' + esc(workflow_url) + '" '
                          'style="color:#2563eb;text-decoration:none;font-weight:bold">'
                          'View workflow run</a>'
                      )
                  else:
                      workflow_link = "Workflow URL not provided"

                  scan = get("SCAN_STATUS", "unknown")
                  gl_status = get("GITLEAKS_STATUS", "unknown")
                  trivy_status = get("TRIVY_STATUS", "unknown")
                  semgrep_status = get("SEMGREP_STATUS", "unknown")
                  sonarqube_status = get("SONARQUBE_STATUS", "unknown")

                  bg, fg, scan_label = status_style(scan)

                  html_doc = f"""<!doctype html>
                  <html>
                  <body style="margin:0;padding:0;background:#f3f4f6;
                               font-family:Arial,Helvetica,sans-serif;color:#111827">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                           style="background:#f3f4f6;padding:24px 8px">
                      <tr><td align="center">
                        <table role="presentation" width="640" cellpadding="0" cellspacing="0"
                               style="max-width:640px;width:100%;background:#ffffff;
                                      border:1px solid #e5e7eb;border-radius:12px;overflow:hidden">
                          <tr>
                            <td style="background:#111827;padding:24px;color:#ffffff">
                              <div style="font-size:12px;letter-spacing:1.5px;color:#cbd5e1">
                                ACTION ENGINE
                              </div>
                              <h1 style="font-size:24px;line-height:1.3;margin:10px 0 6px">
                                Action Engine Security Dashboard
                              </h1>
                              <div style="font-size:14px;color:#d1d5db">{esc(subject)}</div>
                            </td>
                          </tr>

                          <tr><td style="padding:22px 22px 8px">
                            <div style="font-size:13px;color:#6b7280">OVERALL PIPELINE STATUS</div>
                            <div style="margin-top:10px">
                              <span style="display:inline-block;background:{bg};color:{fg};
                                border-radius:6px;padding:8px 12px;font-weight:bold;font-size:13px">
                                {esc(scan_label)}
                              </span>
                            </div>
                            <p style="font-size:13px;line-height:1.6;color:#4b5563;margin:12px 0 0">
                              {summary}
                            </p>
                          </td></tr>

                          <tr><td style="padding:10px 14px 4px">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                              <tr>
                                {status_card("GITLEAKS", gl_status)}
                                {status_card("TRIVY", trivy_status)}
                                {status_card("SEMGREP", semgrep_status)}
                              </tr>
                              <tr>
                                {status_card("SONARQUBE", sonarqube_status)}
                                {status_card("PIPELINE", scan)}
                                <td style="padding:6px;width:33.33%"></td>
                              </tr>
                            </table>
                          </td></tr>

                          <tr><td style="padding:18px 22px 8px">
                            <h2 style="font-size:16px;margin:0 0 12px">Findings Summary</h2>
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                   style="border-collapse:collapse">
                              <tr style="background:#f9fafb">
                                <td style="padding:11px;border:1px solid #e5e7eb;font-size:13px">
                                  Gitleaks findings
                                </td>
                                <td align="right" style="padding:11px;border:1px solid #e5e7eb;
                                    font-size:13px;font-weight:bold">{esc(get("GITLEAKS_COUNT"))}</td>
                              </tr>
                              <tr>
                                <td style="padding:11px;border:1px solid #e5e7eb;font-size:13px">
                                  Trivy findings
                                </td>
                                <td align="right" style="padding:11px;border:1px solid #e5e7eb;
                                    font-size:13px;font-weight:bold">{esc(get("TRIVY_COUNT"))}</td>
                              </tr>
                              <tr style="background:#f9fafb">
                                <td style="padding:11px;border:1px solid #e5e7eb;font-size:13px">
                                  Semgrep SAST findings
                                </td>
                                <td align="right" style="padding:11px;border:1px solid #e5e7eb;
                                    font-size:13px;font-weight:bold">{esc(get("SEMGREP_COUNT"))}</td>
                              </tr>
                              <tr>
                                <td style="padding:11px;border:1px solid #e5e7eb;font-size:13px">
                                  Trivy packages scanned
                                </td>
                                <td align="right" style="padding:11px;border:1px solid #e5e7eb;
                                    font-size:13px;font-weight:bold">{esc(get("TRIVY_PACKAGES_COUNT"))}</td>
                              </tr>
                              <tr style="background:#f9fafb">
                                <td style="padding:11px;border:1px solid #e5e7eb;font-size:13px">
                                  SonarQube Quality Gate
                                </td>
                                <td align="right" style="padding:11px;border:1px solid #e5e7eb;
                                    font-size:13px;font-weight:bold">{esc(get("SONARQUBE_GATE", "N/A"))}</td>
                              </tr>
                              <tr>
                                <td style="padding:11px;border:1px solid #e5e7eb;font-size:13px">
                                  SonarQube Bugs
                                </td>
                                <td align="right" style="padding:11px;border:1px solid #e5e7eb;
                                    font-size:13px;font-weight:bold">{esc(get("SONARQUBE_BUGS", "0"))}</td>
                              </tr>
                              <tr style="background:#f9fafb">
                                <td style="padding:11px;border:1px solid #e5e7eb;font-size:13px">
                                  SonarQube Vulnerabilities
                                </td>
                                <td align="right" style="padding:11px;border:1px solid #e5e7eb;
                                    font-size:13px;font-weight:bold">{esc(get("SONARQUBE_VULNERABILITIES", "0"))}</td>
                              </tr>
                              <tr>
                                <td style="padding:11px;border:1px solid #e5e7eb;font-size:13px">
                                  SonarQube Code Smells
                                </td>
                                <td align="right" style="padding:11px;border:1px solid #e5e7eb;
                                    font-size:13px;font-weight:bold">{esc(get("SONARQUBE_CODE_SMELLS", "0"))}</td>
                              </tr>
                              <tr style="background:#f9fafb">
                                <td style="padding:11px;border:1px solid #e5e7eb;font-size:13px">
                                  SonarQube Security Hotspots
                                </td>
                                <td align="right" style="padding:11px;border:1px solid #e5e7eb;
                                    font-size:13px;font-weight:bold">{esc(get("SONARQUBE_HOTSPOTS", "0"))}</td>
                              </tr>
                              <tr>
                                <td style="padding:11px;border:1px solid #e5e7eb;font-size:13px;font-weight:bold">
                                  Total security findings
                                </td>
                                <td align="right" style="padding:11px;border:1px solid #e5e7eb;
                                    font-size:13px;font-weight:bold">{esc(get("TOTAL_COUNT"))}</td>
                              </tr>
                            </table>
                          </td></tr>

                          <tr><td style="padding:18px 22px">
                            <h2 style="font-size:16px;margin:0 0 10px">Reports &amp; Actions</h2>
                            <p style="font-size:13px;line-height:1.7;color:#4b5563;margin:0 0 12px">
                              The Excel dashboard and available scanner reports are attached to this email.
                              Review findings, investigate exposed secrets, code quality issues, and remediate
                              vulnerabilities or misconfigurations before the next release.
                            </p>
                            {workflow_link}
                          </td></tr>

                          <tr><td style="padding:16px 22px;background:#f9fafb;
                                         border-top:1px solid #e5e7eb">
                            <div style="font-size:11px;line-height:1.6;color:#6b7280">
                              Automated notification from GitHub Actions. Verify scanner statuses and
                              attached reports before treating this scan as clean.
                            </div>
                          </td></tr>
                        </table>
                      </td></tr>
                    </table>
                  </body>
                  </html>
                  """

                  Path("reports/email-dashboard.html").write_text(html_doc, encoding="utf-8")
                  print("HTML security dashboard generated.")
                  PY

            - name: Send Email
              uses: dawidd6/action-send-mail@v23
              with:
                  server_address: smtp.gmail.com
                  server_port: 465
                  secure: true
                  username: ${{ secrets.MAIL_USERNAME }}
                  password: ${{ secrets.MAIL_PASSWORD }}
                  to: ${{ secrets.MAIL_TO }}
                  from: Action Engine <${{ secrets.MAIL_USERNAME }}>
                  subject: ${{ inputs.email_subject }}
                  body: ${{ inputs.email_body }}
                  html_body: file://reports/email-dashboard.html
                  attachments: reports/*
