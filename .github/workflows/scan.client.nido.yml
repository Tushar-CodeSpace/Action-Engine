name: Scan - Client - NIDO

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    scan:
        name: Gitleaks and Trivy
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        steps:
            - name: Checkout Platform Repository
              uses: actions/checkout@v5
              with:
                  path: platform
                  persist-credentials: false

            - name: Prepare Report Directory
              run: |
                  mkdir -p reports
                  printf '[]\n' > reports/gitleaks-report.json
                  printf '{"Results":[]}\n' > reports/trivy-report.json

            - name: Checkout Target Repository
              env:
                  NIDO_USER: ${{ secrets.NIDO_ACCOUNT_USER }}
                  NIDO_TOKEN: ${{ secrets.NIDO_ACCOUNT_PAT }}
              run: |
                  set -euo pipefail

                  if [[ -z "$NIDO_USER" || -z "$NIDO_TOKEN" ]]; then
                    echo "::error::NIDO account credentials are missing."
                    exit 1
                  fi

                  BASIC_AUTH="$(printf '%s:%s' "$NIDO_USER" "$NIDO_TOKEN" | base64 -w 0)"

                  git -c http.extraheader="AUTHORIZATION: basic $BASIC_AUTH" \
                    clone \
                    https://github.com/NIDO-MACHINERIES/nidoworkz-backend.git \
                    target-repo

            - name: Scan Git History with Gitleaks
              id: gitleaks
              continue-on-error: true
              run: |
                  docker run --rm \
                    -v "$GITHUB_WORKSPACE:/workspace" \
                    -w /workspace/target-repo \
                    ghcr.io/gitleaks/gitleaks:v8.30.1 \
                    git . \
                    --redact \
                    --no-banner \
                    --report-format json \
                    --report-path /workspace/reports/gitleaks-report.json

            - name: Install Trivy
              uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
              with:
                  version: latest

            - name: Scan Filesystem with Trivy
              id: trivy
              continue-on-error: true
              run: |
                  trivy fs \
                    --scanners vuln,misconfig \
                    --severity HIGH,CRITICAL \
                    --format json \
                    --output reports/trivy-report.json \
                    --exit-code 1 \
                    --no-progress \
                    target-repo

            - name: Generate Excel Dashboard
              id: report
              if: always()
              env:
                  GITLEAKS_STATUS: ${{ steps.gitleaks.outcome }}
                  TRIVY_STATUS: ${{ steps.trivy.outcome }}
              run: |
                  set -euo pipefail

                  python3 -m venv .venv
                  .venv/bin/python -m pip install openpyxl

                  .venv/bin/python platform/scripts/generate_security_report.py \
                    --gitleaks reports/gitleaks-report.json \
                    --trivy reports/trivy-report.json \
                    --output reports/security-report.xlsx \
                    --repository "NIDO-MACHINERIES/nidoworkz-backend" \
                    --gitleaks-status "$GITLEAKS_STATUS" \
                    --trivy-status "$TRIVY_STATUS" \
                    --workflow-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                    --github-output "$GITHUB_OUTPUT"

            - name: Upload Security Reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: security-reports
                  path: reports/
                  if-no-files-found: warn
                  retention-days: 14

            - name: Fail if a scanner failed
              if: always()
              env:
                  GITLEAKS_STATUS: ${{ steps.gitleaks.outcome }}
                  TRIVY_STATUS: ${{ steps.trivy.outcome }}
              run: |
                  if [[ "$GITLEAKS_STATUS" != "success" || "$TRIVY_STATUS" != "success" ]]; then
                    echo "::error::At least one scanner failed or reported findings. Review the scan logs and reports."
                    exit 1
                  fi
    email:
        name: Email Security Reports
        needs: scan
        if: always()
        uses: ./.github/workflows/send-reports.yml
        with:
            artifact_name: security-reports
            email_subject: "Security Scan - NIDOWORKZ Backend"
            email_body: |
                NIDOWORKZ Backend Security Scan

                Repository: NIDO-MACHINERIES/nidoworkz-backend

                The security scan has completed.
                Download the attached Excel workbook for the summary dashboard
                and detailed Gitleaks and Trivy findings.

                Workflow run:
                ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        secrets: inherit
