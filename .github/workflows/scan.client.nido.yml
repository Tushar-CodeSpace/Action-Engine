name: Scan - Client - NIDO

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    scan:
        name: Gitleaks, Trivy and OWASP
        runs-on: ubuntu-24.04
        timeout-minutes: 45

        steps:
            - name: Checkout Target Repository
              env:
                  NIDO_USER: ${{ secrets.NIDO_ACCOUNT_USER }}
                  NIDO_TOKEN: ${{ secrets.NIDO_ACCOUNT_PAT }}
              run: |
                  set -euo pipefail

                  if [[ -z "$NIDO_USER" || -z "$NIDO_TOKEN" ]]; then
                    echo "::error::NIDO_ACCOUNT_USER or NIDO_ACCOUNT_PAT is missing."
                    exit 1
                  fi

                  git -c http.extraheader="AUTHORIZATION: basic $(printf '%s:%s' "$NIDO_USER" "$NIDO_TOKEN" | base64 -w 0)" \
                    clone \
                    https://github.com/NIDO-MACHINERIES/nidoworkz-backend.git \
                    target-repo

            - name: Prepare Report Files
              run: |
                  mkdir -p owasp-report
                  printf '[]\n' > gitleaks-report.json
                  printf '{"Results":[]}\n' > trivy-report.json
                  printf '{"dependencies":[]}\n' \
                    > owasp-report/dependency-check-report.json

            - name: Scan Git History for Secrets
              id: gitleaks
              continue-on-error: true
              run: |
                  docker run --rm \
                    -v "$GITHUB_WORKSPACE:/workspace" \
                    -w /workspace/target-repo \
                    ghcr.io/gitleaks/gitleaks:v8.30.1 \
                    git . \
                      --redact \
                      --no-banner \
                      --report-format json \
                      --report-path /workspace/gitleaks-report.json

            - name: Install Trivy
              uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
              with:
                  version: latest

            - name: Scan Filesystem with Trivy
              id: trivy
              continue-on-error: true
              run: |
                  trivy fs \
                    --scanners vuln,misconfig \
                    --severity HIGH,CRITICAL \
                    --format json \
                    --output trivy-report.json \
                    --exit-code 1 \
                    --no-progress \
                    target-repo

            - name: OWASP Dependency-Check
              id: owasp
              continue-on-error: true
              env:
                  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
              run: |
                  set -euo pipefail

                  NVD_ARGS=()
                  if [[ -n "${NVD_API_KEY:-}" ]]; then
                    NVD_ARGS+=(--nvdApiKey "$NVD_API_KEY")
                  else
                    echo "::warning::NVD_API_KEY is not configured. Updates may be slower."
                  fi

                  docker run --rm \
                    -v "$GITHUB_WORKSPACE/target-repo:/src:ro" \
                    -v "$GITHUB_WORKSPACE/owasp-report:/report" \
                    owasp/dependency-check:latest \
                    --scan /src \
                    --project "NIDOWORKZ Backend" \
                    --format JSON \
                    --out /report \
                    "${NVD_ARGS[@]}"

            - name: Install Excel Dependency
              if: always()
              run: |
                  python3 -m venv .venv
                  .venv/bin/python -m pip install openpyxl

            - name: Generate Excel Report
              id: generate_report
              if: always()
              env:
                  GITLEAKS_STATUS: ${{ steps.gitleaks.outcome }}
                  TRIVY_STATUS: ${{ steps.trivy.outcome }}
                  OWASP_STATUS: ${{ steps.owasp.outcome }}
              run: |
                  cat > generate_report.py <<'PY'
                  import json
                  import os
                  from datetime import datetime, timezone
                  from openpyxl import Workbook
                  from openpyxl.styles import Font, PatternFill, Alignment
                  from openpyxl.utils import get_column_letter

                  def load_json(path, default):
                      try:
                          with open(path, encoding="utf-8") as f:
                              return json.load(f)
                      except (OSError, json.JSONDecodeError):
                          return default

                  gitleaks = load_json("gitleaks-report.json", [])
                  trivy = load_json("trivy-report.json", {})
                  owasp = load_json(
                      "owasp-report/dependency-check-report.json", {}
                  )

                  if not isinstance(gitleaks, list):
                      gitleaks = []

                  gitleaks_rows = []
                  for item in gitleaks:
                      gitleaks_rows.append([
                          item.get("RuleID", ""),
                          item.get("Description", ""),
                          item.get("File", ""),
                          item.get("StartLine", ""),
                          item.get("Commit", ""),
                          item.get("Author", ""),
                          item.get("Date", ""),
                      ])

                  trivy_rows = []
                  for result in trivy.get("Results", []) or []:
                      target = result.get("Target", "")

                      for vuln in result.get("Vulnerabilities", []) or []:
                          trivy_rows.append([
                              "Vulnerability",
                              vuln.get("VulnerabilityID", ""),
                              vuln.get("PkgName", ""),
                              vuln.get("InstalledVersion", ""),
                              vuln.get("FixedVersion", ""),
                              vuln.get("Severity", ""),
                              target,
                              vuln.get("Title", ""),
                          ])

                      for issue in result.get("Misconfigurations", []) or []:
                          trivy_rows.append([
                              "Misconfiguration",
                              issue.get("ID", ""),
                              issue.get("Type", ""),
                              "",
                              "",
                              issue.get("Severity", ""),
                              target,
                              issue.get("Title", ""),
                          ])

                  owasp_rows = []
                  for dependency in owasp.get("dependencies", []) or []:
                      for vuln in dependency.get("vulnerabilities", []) or []:
                          cvss = vuln.get("cvssv3", {}) or {}
                          references = vuln.get("references", []) or []

                          owasp_rows.append([
                              dependency.get("fileName", ""),
                              dependency.get("filePath", ""),
                              vuln.get("name", ""),
                              vuln.get("severity", ""),
                              cvss.get("baseScore", ""),
                              vuln.get("description", ""),
                              ", ".join(
                                  ref.get("url", "")
                                  for ref in references
                                  if ref.get("url")
                              ),
                          ])

                  gitleaks_status = os.getenv("GITLEAKS_STATUS", "unknown")
                  trivy_status = os.getenv("TRIVY_STATUS", "unknown")
                  owasp_status = os.getenv("OWASP_STATUS", "unknown")

                  total = len(gitleaks_rows) + len(trivy_rows) + len(owasp_rows)

                  wb = Workbook()
                  summary = wb.active
                  summary.title = "Summary"

                  summary_rows = [
                      ["NIDOWORKZ Backend Security Scan"],
                      ["Repository", "NIDO-MACHINERIES/nidoworkz-backend"],
                      ["Generated (UTC)", datetime.now(timezone.utc).strftime(
                          "%Y-%m-%d %H:%M:%S"
                      )],
                      ["Gitleaks step outcome", gitleaks_status],
                      ["Gitleaks findings", len(gitleaks_rows)],
                      ["Trivy step outcome", trivy_status],
                      ["Trivy findings", len(trivy_rows)],
                      ["OWASP step outcome", owasp_status],
                      ["OWASP findings", len(owasp_rows)],
                      ["Total findings", total],
                      ["Interpretation",
                       "A failed scan may indicate findings or a scanner error. "
                       "Review workflow logs before drawing conclusions."],
                  ]

                  for row in summary_rows:
                      summary.append(row)

                  def add_sheet(name, headers, rows):
                      ws = wb.create_sheet(name)
                      ws.append(headers)
                      for row in rows:
                          ws.append(row)
                      return ws

                  add_sheet(
                      "Gitleaks Findings",
                      ["Rule ID", "Description", "File", "Start Line",
                       "Commit", "Author", "Date"],
                      gitleaks_rows,
                  )

                  add_sheet(
                      "Trivy Findings",
                      ["Finding Type", "ID", "Package / Type",
                       "Installed Version", "Fixed Version", "Severity",
                       "Target File", "Title"],
                      trivy_rows,
                  )

                  add_sheet(
                      "OWASP Findings",
                      ["Dependency", "File Path", "CVE", "Severity",
                       "CVSS Score", "Description", "References"],
                      owasp_rows,
                  )

                  for ws in wb.worksheets:
                      ws.freeze_panes = "A2"
                      ws.auto_filter.ref = ws.dimensions

                      for cell in ws[1]:
                          cell.font = Font(bold=True, color="FFFFFF")
                          cell.fill = PatternFill("solid", fgColor="1F4E78")
                          cell.alignment = Alignment(
                              wrap_text=True, vertical="top"
                          )

                      for column_cells in ws.columns:
                          letter = get_column_letter(column_cells[0].column)
                          max_length = max(
                              len(str(cell.value or ""))
                              for cell in column_cells
                          )
                          ws.column_dimensions[letter].width = min(
                              max(max_length + 2, 14), 55
                          )

                      for row in ws.iter_rows():
                          for cell in row:
                              cell.alignment = Alignment(
                                  vertical="top", wrap_text=True
                              )

                  summary.column_dimensions["A"].width = 30
                  summary.column_dimensions["B"].width = 85

                  wb.save("security-report.xlsx")

                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write(f"gitleaks_count={len(gitleaks_rows)}\n")
                      output.write(f"trivy_count={len(trivy_rows)}\n")
                      output.write(f"owasp_count={len(owasp_rows)}\n")
                      output.write(f"total_count={total}\n")
                  PY

                  .venv/bin/python generate_report.py

            - name: Email Security Reports
              if: always()
              uses: dawidd6/action-send-mail@v4
              with:
                  server_address: smtp.gmail.com
                  server_port: 465
                  secure: true
                  username: ${{ secrets.MAIL_USERNAME }}
                  password: ${{ secrets.MAIL_PASSWORD }}
                  to: ${{ secrets.MAIL_TO }}
                  from: GitHub Security Scanner
                  subject: "Security Report - NIDOWORKZ Backend"
                  body: |
                      NIDOWORKZ Backend Security Scan

                      Repository: NIDO-MACHINERIES/nidoworkz-backend

                      GITLEAKS
                      Status: ${{ steps.gitleaks.outcome }}
                      Findings: ${{ steps.generate_report.outputs.gitleaks_count }}

                      TRIVY
                      Status: ${{ steps.trivy.outcome }}
                      Findings: ${{ steps.generate_report.outputs.trivy_count }}

                      OWASP DEPENDENCY-CHECK
                      Status: ${{ steps.owasp.outcome }}
                      Findings: ${{ steps.generate_report.outputs.owasp_count }}

                      TOTAL FINDINGS: ${{ steps.generate_report.outputs.total_count }}

                      The Excel attachment contains the summary and detailed findings.
                      JSON reports are also attached.

                      Workflow run:
                      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  attachments: security-report.xlsx,gitleaks-report.json,trivy-report.json,owasp-report/dependency-check-report.json
