name: Scan - Client - NIDO

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    scan:
        name: Gitleaks and Trivy
        runs-on: [self-hosted, Linux, X64, ActionEngine]
        timeout-minutes: 30

        steps:
            - name: Prepare Report Directory
              run: |
                  mkdir -p reports
                  printf '[]\n' > reports/gitleaks-report.json
                  printf '{"Results":[]}\n' > reports/trivy-report.json

            - name: Checkout Target Repository
              env:
                  NIDO_USER: ${{ secrets.NIDO_ACCOUNT_USER }}
                  NIDO_TOKEN: ${{ secrets.NIDO_ACCOUNT_PAT }}
              run: |
                  set -euo pipefail

                  if [[ -z "$NIDO_USER" || -z "$NIDO_TOKEN" ]]; then
                    echo "::error::NIDO account credentials are missing."
                    exit 1
                  fi

                  BASIC_AUTH="$(printf '%s:%s' "$NIDO_USER" "$NIDO_TOKEN" | base64 -w 0)"

                  git -c http.extraheader="AUTHORIZATION: basic $BASIC_AUTH" \
                    clone \
                    https://github.com/NIDO-MACHINERIES/nidoworkz-backend.git \
                    target-repo

            - name: Scan Git History with Gitleaks
              id: gitleaks
              continue-on-error: true
              run: |
                  docker run --rm \
                    -v "$GITHUB_WORKSPACE:/workspace" \
                    -w /workspace/target-repo \
                    ghcr.io/gitleaks/gitleaks:v8.30.1 \
                    git . \
                    --redact \
                    --no-banner \
                    --report-format json \
                    --report-path /workspace/reports/gitleaks-report.json

            - name: Install Trivy
              uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
              with:
                  version: latest

            - name: Scan Filesystem with Trivy
              id: trivy
              continue-on-error: true
              run: |
                  trivy fs \
                    --scanners vuln,misconfig \
                    --severity HIGH,CRITICAL \
                    --format json \
                    --output reports/trivy-report.json \
                    --exit-code 1 \
                    --no-progress \
                    target-repo

            - name: Generate Excel Dashboard
              id: report
              if: always()
              env:
                  GITLEAKS_STATUS: ${{ steps.gitleaks.outcome }}
                  TRIVY_STATUS: ${{ steps.trivy.outcome }}
              run: |
                  set -euo pipefail

                  python3 -m venv .venv
                  .venv/bin/python -m pip install openpyxl

                  cat > generate_report.py <<'PY'
                  import json
                  import os
                  from datetime import datetime, timezone
                  from openpyxl import Workbook
                  from openpyxl.styles import Font, PatternFill, Alignment, Border, Side
                  from openpyxl.utils import get_column_letter
                  from openpyxl.formatting.rule import CellIsRule

                  def load(path, default):
                      try:
                          with open(path, encoding="utf-8") as f:
                              return json.load(f)
                      except (OSError, ValueError):
                          return default

                  secrets_found = load("reports/gitleaks-report.json", [])
                  trivy = load("reports/trivy-report.json", {})
                  if not isinstance(secrets_found, list):
                      secrets_found = []

                  secret_rows = [[
                      x.get("RuleID", ""),
                      x.get("Description", ""),
                      x.get("File", ""),
                      x.get("StartLine", ""),
                      x.get("Commit", ""),
                      x.get("Author", ""),
                      x.get("Date", ""),
                  ] for x in secrets_found]

                  trivy_rows = []
                  severity_counts = {
                      "CRITICAL": 0, "HIGH": 0, "MEDIUM": 0,
                      "LOW": 0, "UNKNOWN": 0
                  }

                  for result in trivy.get("Results", []) or []:
                      target = result.get("Target", "")

                      for vuln in result.get("Vulnerabilities", []) or []:
                          severity = (vuln.get("Severity") or "UNKNOWN").upper()
                          severity_counts[severity] = severity_counts.get(severity, 0) + 1
                          trivy_rows.append([
                              "Vulnerability",
                              vuln.get("VulnerabilityID", ""),
                              vuln.get("PkgName", ""),
                              vuln.get("InstalledVersion", ""),
                              vuln.get("FixedVersion", ""),
                              severity,
                              target,
                              vuln.get("Title", ""),
                          ])

                      for issue in result.get("Misconfigurations", []) or []:
                          severity = (issue.get("Severity") or "UNKNOWN").upper()
                          severity_counts[severity] = severity_counts.get(severity, 0) + 1
                          trivy_rows.append([
                              "Misconfiguration",
                              issue.get("ID", ""),
                              issue.get("Type", ""),
                              "",
                              "",
                              severity,
                              target,
                              issue.get("Title", ""),
                          ])

                  wb = Workbook()
                  ws = wb.active
                  ws.title = "Executive Summary"

                  ws.append(["NIDOWORKZ | SECURITY SCAN"])
                  ws.append(["Repository", "NIDO-MACHINERIES/nidoworkz-backend"])
                  ws.append(["Scan time (UTC)", datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S")])
                  ws.append(["Gitleaks status", os.getenv("GITLEAKS_STATUS", "unknown")])
                  ws.append(["Gitleaks findings", len(secret_rows)])
                  ws.append(["Trivy status", os.getenv("TRIVY_STATUS", "unknown")])
                  ws.append(["Trivy findings", len(trivy_rows)])
                  ws.append(["Total findings", len(secret_rows) + len(trivy_rows)])
                  ws.append(["", ""])
                  ws.append(["TRIVY SEVERITY BREAKDOWN", "Count"])

                  for severity in ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]:
                      ws.append([severity, severity_counts.get(severity, 0)])

                  ws.append(["", ""])
                  ws.append(["Interpretation",
                             "A failed scanner may indicate findings or a scanner error. Review run logs."])
                  ws.append(["Workflow run", os.getenv("GITHUB_SERVER_URL", "https://github.com")
                             + "/" + os.getenv("GITHUB_REPOSITORY", "")
                             + "/actions/runs/" + os.getenv("GITHUB_RUN_ID", "")])

                  def add_sheet(title, headers, rows):
                      sheet = wb.create_sheet(title)
                      sheet.append(headers)
                      for row in rows:
                          sheet.append(row)
                      sheet.freeze_panes = "A2"
                      sheet.auto_filter.ref = sheet.dimensions
                      return sheet

                  add_sheet("Gitleaks Findings", [
                      "Rule ID", "Description", "File", "Start Line",
                      "Commit", "Author", "Date"
                  ], secret_rows)

                  add_sheet("Trivy Findings", [
                      "Finding Type", "ID", "Package / Type", "Installed Version",
                      "Fixed Version", "Severity", "Target File", "Title"
                  ], trivy_rows)

                  header_fill = PatternFill("solid", fgColor="17365D")
                  header_font = Font(bold=True, color="FFFFFF")
                  thin_gray = Side(style="thin", color="D9E2F3")

                  for sheet in wb.worksheets:
                      sheet.sheet_view.showGridLines = False
                      for cell in sheet[1]:
                          cell.fill = header_fill
                          cell.font = header_font
                          cell.alignment = Alignment(wrap_text=True, vertical="center")
                      sheet.row_dimensions[1].height = 28

                      for row in sheet.iter_rows():
                          for cell in row:
                              cell.alignment = Alignment(vertical="top", wrap_text=True)
                              cell.border = Border(bottom=thin_gray)

                      for col in sheet.columns:
                          letter = get_column_letter(col[0].column)
                          width = max(len(str(c.value or "")) for c in col) + 2
                          sheet.column_dimensions[letter].width = min(max(width, 14), 55)

                  ws.column_dimensions["A"].width = 30
                  ws.column_dimensions["B"].width = 85
                  ws.freeze_panes = "A2"

                  # Highlight non-zero severity counts.
                  for severity_row in range(11, 16):
                      ws.cell(severity_row, 2).number_format = "0"

                  wb.save("reports/security-report.xlsx")

                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                      f.write(f"gitleaks_count={len(secret_rows)}\n")
                      f.write(f"trivy_count={len(trivy_rows)}\n")
                      f.write(f"total_count={len(secret_rows) + len(trivy_rows)}\n")
                  PY

                  GITHUB_SERVER_URL="$GITHUB_SERVER_URL" \
                  GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
                  GITHUB_RUN_ID="$GITHUB_RUN_ID" \
                    .venv/bin/python generate_report.py

            - name: Upload Security Reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: security-reports
                  path: reports/
                  if-no-files-found: warn
                  retention-days: 14

            - name: Fail if a scanner failed
              if: always()
              env:
                  GITLEAKS_STATUS: ${{ steps.gitleaks.outcome }}
                  TRIVY_STATUS: ${{ steps.trivy.outcome }}
              run: |
                  if [[ "$GITLEAKS_STATUS" != "success" || "$TRIVY_STATUS" != "success" ]]; then
                    echo "::error::At least one scanner failed or reported findings. Review the scan logs and reports."
                    exit 1
                  fi
