name: Scan - Client - NIDO

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    scan:
        name: Gitleaks and Trivy
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        outputs:
            gitleaks_status: ${{ steps.gitleaks.outcome }}
            trivy_status: ${{ steps.trivy.outcome }}
            gitleaks_count: ${{ steps.report.outputs.gitleaks_count }}
            trivy_count: ${{ steps.report.outputs.trivy_count }}
            total_count: ${{ steps.report.outputs.total_count }}

        env:
            TARGET_REPOSITORY: NIDO-MACHINERIES/nidoworkz-backend
            GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
            TRIVY_VERSION: "0.69.3"
            TRIVY_SEVERITY: HIGH,CRITICAL
            TRIVY_SCANNERS: vuln,misconfig
            REPORT_RETENTION_DAYS: "14"

        steps:
            - name: Checkout Platform Repository
              uses: actions/checkout@v5
              with:
                  path: platform
                  persist-credentials: false

            - name: Validate Configuration
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
                    echo "::error::Invalid target repository format."
                    exit 1
                  fi

                  if [[ ! "$REPORT_RETENTION_DAYS" =~ ^[0-9]+$ ]] ||
                     (( REPORT_RETENTION_DAYS < 1 || REPORT_RETENTION_DAYS > 90 )); then
                    echo "::error::REPORT_RETENTION_DAYS must be between 1 and 90."
                    exit 1
                  fi

            - name: Prepare Report Directory
              shell: bash
              run: |
                  mkdir -p reports
                  printf '[]\n' > reports/gitleaks-report.json
                  printf '{"Results":[]}\n' > reports/trivy-report.json

            - name: Checkout Target Repository
              env:
                  NIDO_USER: ${{ secrets.NIDO_ACCOUNT_USER }}
                  NIDO_TOKEN: ${{ secrets.NIDO_ACCOUNT_PAT }}
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ -z "$NIDO_USER" || -z "$NIDO_TOKEN" ]]; then
                    echo "::error::NIDO repository credentials are missing."
                    exit 1
                  fi

                  BASIC_AUTH="$(printf '%s:%s' "$NIDO_USER" "$NIDO_TOKEN" | base64 -w 0)"

                  git -c http.extraheader="AUTHORIZATION: basic $BASIC_AUTH" \
                    clone \
                    "https://github.com/${TARGET_REPOSITORY}.git" \
                    target-repo

            - name: Scan Git History with Gitleaks
              id: gitleaks
              continue-on-error: true
              shell: bash
              run: |
                  docker run --rm \
                    -v "$GITHUB_WORKSPACE:/workspace" \
                    -w /workspace/target-repo \
                    "$GITLEAKS_IMAGE" \
                    git . \
                    --redact \
                    --no-banner \
                    --report-format json \
                    --report-path /workspace/reports/gitleaks-report.json

            - name: Install Trivy
              uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
              with:
                  version: ${{ env.TRIVY_VERSION }}

            - name: Scan Filesystem with Trivy
              id: trivy
              continue-on-error: true
              shell: bash
              run: |
                  trivy fs \
                    --scanners "$TRIVY_SCANNERS" \
                    --severity "$TRIVY_SEVERITY" \
                    --format json \
                    --output reports/trivy-report.json \
                    --exit-code 1 \
                    --no-progress \
                    target-repo

            - name: Generate Excel Dashboard
              id: report
              if: always()
              env:
                  GITLEAKS_STATUS: ${{ steps.gitleaks.outcome }}
                  TRIVY_STATUS: ${{ steps.trivy.outcome }}
              shell: bash
              run: |
                  set -euo pipefail

                  python3 -m venv .venv
                  .venv/bin/python -m pip install openpyxl

                  .venv/bin/python platform/scripts/generate_security_report.py \
                    --gitleaks reports/gitleaks-report.json \
                    --trivy reports/trivy-report.json \
                    --output reports/security-report.xlsx \
                    --repository "$TARGET_REPOSITORY" \
                    --gitleaks-status "$GITLEAKS_STATUS" \
                    --trivy-status "$TRIVY_STATUS" \
                    --workflow-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                    --github-output "$GITHUB_OUTPUT"

            - name: Upload Security Reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: security-reports
                  path: reports/
                  if-no-files-found: warn
                  retention-days: 14

            - name: Fail if a scanner failed or found issues
              if: always()
              env:
                  GITLEAKS_STATUS: ${{ steps.gitleaks.outcome }}
                  TRIVY_STATUS: ${{ steps.trivy.outcome }}
              shell: bash
              run: |
                  if [[ "$GITLEAKS_STATUS" != "success" || "$TRIVY_STATUS" != "success" ]]; then
                    echo "::error::A scanner reported findings or encountered an error. Review reports and logs."
                    exit 1
                  fi

    email:
        name: Security Reports
        needs: scan
        if: always()
        uses: ./.github/workflows/send-reports.yml

        with:
            artifact_name: security-reports
            email_subject: "Security Scan - NIDOWORKZ Backend"
            email_body: |
                Repository: NIDO-MACHINERIES/nidoworkz-backend
                Review the attached security reports.
            workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            scan_status: ${{ needs.scan.result }}
            gitleaks_status: ${{ needs.scan.outputs.gitleaks_status }}
            trivy_status: ${{ needs.scan.outputs.trivy_status }}
            gitleaks_count: ${{ needs.scan.outputs.gitleaks_count }}
            trivy_count: ${{ needs.scan.outputs.trivy_count }}
            total_count: ${{ needs.scan.outputs.total_count }}
        secrets: inherit
