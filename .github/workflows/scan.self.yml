name: Scan - Self

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    gitleaks:
        name: Secret Scan (Gitleaks)
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Scan for secrets
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    trivy:
        name: File System Scan (Trivy)
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Install Trivy
              uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
              with:
                  version: latest

            - name: Scan filesystem for vulnerabilities and misconfigurations
              run: |
                  trivy fs \
                    --scanners vuln,misconfig \
                    --severity HIGH,CRITICAL \
                    --exit-code 1 \
                    --no-progress \
                    .
