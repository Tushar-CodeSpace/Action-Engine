name: NidoWorkZ Backend CI

on:
    push:
        branches: 
            - "**"
    workflow_dispatch:

permissions:
    contents: read

env:
    TARGET_REPO: NIDO-MACHINERIES/nidoworkz-backend
    TARGET_BRANCH: feature/NIT-314/document-service-db-configs
    TARGET_REPO_USER: ${{secrets.NIDO_ACCOUNT_USER}}
    TARGET_REPO_PAT: ${{secrets.NIDO_ACCOUNT_PAT}}
    TARGET_DIR: ./nidoworkz-backend

jobs:
    dockerization:
        name: Dockerization
        runs-on: [self-hosted, ActionEngine]
        timeout-minutes: 30
        steps:
            - name: Checkout Target Repo
              uses: actions/checkout@v5
              with:
                  repository: ${{env.TARGET_REPO}}
                  ref: ${{env.TARGET_BRANCH}}
                  token: ${{env.TARGET_REPO_PAT}}
                  path: ${{env.TARGET_DIR}}
                  persist-credentials: false
                  clean: true

            - name: show files
              run: |
                  ls -la ${{env.TARGET_DIR}}
