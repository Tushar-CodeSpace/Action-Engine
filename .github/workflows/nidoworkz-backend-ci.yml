name: NidoWorkZ Backend CI

on:
    push:
        branches:
            - "**"
    workflow_dispatch:

permissions:
    contents: read

env:
    TARGET_REPO: NIDO-MACHINERIES/nidoworkz-backend
    TARGET_BRANCH: feature/NIT-314/document-service-db-configs
    TARGET_REPO_USER: ${{secrets.NIDO_ACCOUNT_USER}}
    TARGET_REPO_PAT: ${{secrets.NIDO_ACCOUNT_PAT}}
    TARGET_DIR: ./nidoworkz-backend

jobs:
    dockerization:
        name: Dockerization
        runs-on: [self-hosted, ActionEngine]
        timeout-minutes: 30
        steps:
            - name: Checkout Target Repo
              uses: actions/checkout@v5
              with:
                  repository: ${{env.TARGET_REPO}}
                  ref: ${{env.TARGET_BRANCH}}
                  token: ${{env.TARGET_REPO_PAT}}
                  path: ${{env.TARGET_DIR}}
                  persist-credentials: false
                  clean: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Base Image
              uses: docker/build-push-action@v6
              with:
                  context: ${{ env.TARGET_DIR }}
                  file: ${{ env.TARGET_DIR }}/Dockerfile.base
                  push: false
                  tags: nidoworkz-base:v0.1

            - name: Build ADI Image
              uses: docker/build-push-action@v6
              with:
                  context: ${{ env.TARGET_DIR }}/app-device-interface
                  file: ${{ env.TARGET_DIR }}/app-device-interface/Dockerfile
                  push: false
                  tags: nidoworkz-adi:v0.1
